name: Build Menu

on:
  push:
    branches: [main]
    paths:
      - '*.html'
      - 'build-menu.ps1'
      - '.github/workflows/build-menu.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate menu
        shell: pwsh
        run: ./build-menu.ps1

      - name: Commit if changed
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "index.html unchanged, nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "chore: rebuild menu (auto)"
          git push
